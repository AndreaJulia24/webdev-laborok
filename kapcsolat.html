        <h1>Kapcsolat</h1>
        <p class="contact-desc">Kérdésed vagy projektötleted van? Írj bátran üzenetet!</p>

        <!-- HTML 10. Feladat: Kapcsolatfelvételi űrlap -->
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Név:</label>
                <input type="text" id="name" name="name" placeholder="Add meg a neved..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="pelda@email.com" required>
            </div>

            <div class="form-group">
                <label for="message">Üzenet:</label>
                <textarea id="message" name="message" rows="5" placeholder="Írd ide az üzeneted..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">Küldés</button>
        </form>
    </section>
</main>
